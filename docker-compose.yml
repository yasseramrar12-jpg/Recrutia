# Pile complète RECRUT'IA : base PostgreSQL + API + frontend.
# Démarrage :  docker compose up --build
# Application : http://localhost:8080  (compte démo : rh@demo.fr / demo1234)

services:
  basededonnees:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recrutia
      POSTGRES_USER: recrutia
      POSTGRES_PASSWORD: recrutia          # à changer hors développement
    volumes:
      - donnees_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recrutia"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://recrutia:recrutia@basededonnees:5432/recrutia
      SECRET_JWT: ${SECRET_JWT:-cle-de-developpement-a-changer-en-production-0123456789}
      DOSSIER_CVS: /donnees/cvs
    volumes:
      - donnees_cvs:/donnees/cvs
    depends_on:
      basededonnees:
        condition: service_healthy
    ports:
      - "8000:8000"        # accès direct à l'API et à /docs en développement

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  donnees_postgres:
  donnees_cvs:

# Sert le frontend et transmet /api au backend (équivalent du proxy Vite en dev).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        client_max_body_size 25m;   # téléversement de plusieurs CV PDF
    }

    location / {
        try_files $uri /index.html;
    }
}
